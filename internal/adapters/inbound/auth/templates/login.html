<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — POS Core Restaurante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --input-bg: #0f172a;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      font-size: 2.75rem;
      line-height: 1;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .alert-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      color: #fcd34d;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .demo-users {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
    }

    .demo-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-align: center;
      font-weight: 600;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .demo-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.75rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn:hover {
      background: #1e293b;
      border-color: var(--primary);
      color: var(--text);
    }

    .demo-btn strong {
      display: block;
      color: var(--text);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">🍽️</div>
      <h1 class="brand-title">POS RESTAURANTE</h1>
      <p class="brand-subtitle">Control de Acceso &amp; Punto de Venta</p>
    </div>

    {{if .Error}}
      <div class="alert alert-danger">
        <span>⚠️</span>
        <span>{{.Error}}</span>
      </div>
    {{end}}

    {{if .Expired}}
      <div class="alert alert-warning">
        <span>⏱️</span>
        <span>Su sesión ha vencido. Por favor ingrese de nuevo.</span>
      </div>
    {{end}}

    <form method="POST" action="/login" id="loginForm">
      {{if .CSRFToken}}
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      {{end}}

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="admin@restaurante.com" required autofocus value="{{.Email}}">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Ingresar al Sistema</button>
    </form>

    <div class="demo-users">
      <div class="demo-title">Accesos Rápidos Demo</div>
      <div class="demo-grid">
        <button type="button" class="demo-btn" onclick="fillUser('admin@restaurante.com', 'Admin1234!')">
          <strong>Administrador</strong>
          Panel completo
        </button>
        <button type="button" class="demo-btn" onclick="fillUser('gerente@restaurante.com', 'Gerente1234!')">
          <strong>Gerente</strong>
          Operaciones &amp; Stock
        </button>
        <button type="button" class="demo-btn" onclick="fillUser('cocinero@restaurante.com', 'Cocina1234!')">
          <strong>Cocinero</strong>
          Cocina KDS
        </button>
        <button type="button" class="demo-btn" onclick="fillUser('mesero@restaurante.com', 'Mesero1234!')">
          <strong>Mesero</strong>
          Mesa POS
        </button>
      </div>
    </div>
  </div>

  <script>
    function fillUser(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }
  </script>
</body>
</html>
